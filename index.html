<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finance Auction — Topic 15</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== Tokens ===== */
:root{--em:#0f9d6e;--em2:#0b7a56;--mint:#cdf3e3;--cream:#fff6e2;--navy:#12233f;--gold:#ffc633;--gold2:#ffe08a;--red:#ef4b4b;--green:#2fc27a;--r:26px;--sh:0 4px 0 var(--navy),0 14px 26px #12233f33}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;min-height:100vh;color:var(--navy);font-family:Fredoka,"Arial Rounded MT Bold","Trebuchet MS",sans-serif;font-weight:600;
background:radial-gradient(circle at 12% 8%,#fff 0,#fff0 35%),linear-gradient(180deg,var(--cream) 0,var(--mint) 55%,#9be0c4 100%) fixed}
.hidden{display:none!important}
/* ===== Background decoration ===== */
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
#bg i{position:absolute;top:-60px;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,var(--gold) 55%,#d99a00);border:3px solid var(--navy);animation:fall linear infinite;opacity:.55}
#bg svg{position:absolute;bottom:0;left:0;width:100%;height:30vh;opacity:.5}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
/* ===== Header ===== */
header{display:flex;justify-content:space-between;align-items:center;padding:12px 22px;gap:10px;flex-wrap:wrap}
header b{font-size:22px}
.top{display:flex;gap:8px;align-items:center}
.wrap{max-width:1240px;margin:auto;padding:6px 18px 40px}
/* ===== Primitives ===== */
.card{background:var(--gold);border:3px solid var(--navy);border-radius:var(--r);padding:20px;margin-bottom:18px;box-shadow:var(--sh)}
.card.white{background:#fff}
.card.green{background:var(--em);color:#fff}
.card.green .pill{color:var(--navy)}
h1,h2,h3{margin:0 0 8px}
.center{text-align:center}
.pill{display:inline-block;background:#fff;border:3px solid var(--navy);border-radius:999px;padding:3px 14px;margin:0 6px 6px 0;font-size:15px;text-transform:uppercase}
.btn,.chip,.opt{position:relative;overflow:hidden;font-family:inherit;font-weight:700;color:var(--navy);cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s}
.btn{background:var(--gold);border:3px solid var(--navy);border-radius:999px;padding:11px 26px;font-size:18px;text-transform:uppercase;box-shadow:0 4px 0 var(--navy)}
.btn:hover:not(:disabled){transform:translateY(-3px) scale(1.03);box-shadow:0 7px 0 var(--navy),0 0 22px #ffc63399}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--navy)}
.btn.alt{background:#fff}.btn.sm{padding:6px 14px;font-size:15px}
.btn.go{background:var(--em);color:#fff;font-size:26px;padding:16px 44px;animation:glow 2.4s ease-in-out infinite}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:4px solid var(--em2);outline-offset:3px}
input{width:100%;font:inherit;color:var(--navy);padding:12px 16px;margin:6px 0 14px;border:3px solid var(--navy);border-radius:18px;background:#fff}
.ripple{position:absolute;border-radius:50%;background:#fff9;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
/* ===== Animation classes ===== */
.fade-in{animation:fade .4s both}.slide-up{animation:slide .45s both}.scale-in{animation:scale .35s both}
.pop{animation:pop .4s}.shake{animation:shake .45s}.float{animation:float 3.5s ease-in-out infinite}
.pulse{animation:pulse .5s}.glow{animation:glow 2s ease-in-out infinite}.number-pop{animation:npop .45s}.hammer-swing{animation:swing .5s}
@keyframes fade{from{opacity:0}}@keyframes slide{from{opacity:0;transform:translateY(24px)}}@keyframes scale{from{opacity:0;transform:scale(.8)}}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.06)}100%{transform:none}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes float{50%{transform:translateY(-12px) rotate(-2deg)}}
@keyframes pulse{50%{transform:scale(1.04);box-shadow:0 0 0 12px #ffc63355}}
@keyframes glow{50%{box-shadow:0 4px 0 var(--navy),0 0 30px #0f9d6e99}}
@keyframes npop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.3)}100%{transform:none;opacity:1}}
@keyframes swing{30%{transform:rotate(-28deg)}60%{transform:rotate(12deg)}}
/* ===== Start ===== */
#start{padding-top:3vh;text-align:center}
.title{font-size:clamp(52px,10vw,118px);line-height:.92;margin:0;text-transform:uppercase;color:var(--em2);text-shadow:0 5px 0 var(--navy),0 8px 0 var(--gold);-webkit-text-stroke:3px var(--navy);animation:slide .7s both}
.topic{display:inline-block;margin:14px 0;background:var(--navy);color:var(--gold);border-radius:999px;padding:6px 26px;font-size:24px;letter-spacing:3px}
.hero{width:min(300px,60vw);margin:10px auto}
.menu{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.menu .btn{animation:slide .5s both}.menu .btn:nth-child(2){animation-delay:.12s}.menu .btn:nth-child(3){animation-delay:.24s}
.narrow{max-width:540px;margin:24px auto}
/* ===== Rules ===== */
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:14px 0}
.rule{background:#fff;border:3px solid var(--navy);border-radius:22px;padding:14px;text-align:center;box-shadow:0 4px 0 var(--navy);animation:slide .5s both}
.rule em{display:block;font-style:normal;font-size:38px}.rule small{display:block;opacity:.7;font-size:14px}.rule b{font-size:26px;color:var(--em2)}
.rule.bad b{color:var(--red)}
/* ===== Game layout ===== */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px}
.q{position:relative;background:#fff;border:3px solid var(--navy);border-radius:30px;padding:22px 28px 22px 120px;font-size:clamp(20px,2.6vw,30px);line-height:1.25;margin:10px 0 16px;box-shadow:0 5px 0 var(--navy),0 12px 0 var(--gold),0 22px 30px #12233f33;transition:transform .2s;animation:scale .4s both}
.q:hover{transform:translateY(-3px)}
.q small{display:block;font-size:14px;color:var(--em2);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.q svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:84px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:10px}
.opt{all:unset;box-sizing:border-box;position:relative;overflow:hidden;cursor:pointer;display:flex;align-items:center;gap:14px;padding:14px 16px;background:#fff;border:3px solid var(--navy);border-radius:24px;box-shadow:0 4px 0 var(--navy);font-weight:700;font-size:19px;min-height:84px;color:var(--navy);transition:transform .15s,box-shadow .15s,background .15s;animation:slide .4s both}
.opt:nth-child(2){animation-delay:.07s}.opt:nth-child(3){animation-delay:.14s}.opt:nth-child(4){animation-delay:.21s}
.opt i{font-style:normal;flex:none;width:52px;height:52px;border-radius:16px;background:var(--em);color:#fff;border:3px solid var(--navy);display:grid;place-items:center;font-size:26px;transition:transform .2s}
.opt u{text-decoration:none;margin-left:auto;font-size:26px;opacity:.55}
.opt:hover:not([disabled]){transform:translateY(-4px) rotate(-.6deg);box-shadow:0 8px 0 var(--navy);background:var(--gold2)}
.opt:hover:not([disabled]) i{transform:rotate(-8deg) scale(1.1)}
.opt:active:not([disabled]){transform:scale(.97)}
.opt[disabled]{cursor:default}
.opt.ok{background:#9be8b8;animation:pop .45s}.opt.bad{background:#ffadad;animation:shake .45s}.opt.dim{opacity:.4}
.result{text-align:center;font-size:clamp(20px,3vw,30px);padding:14px;border:3px solid var(--navy);border-radius:24px;margin:10px 0;animation:pop .45s;box-shadow:0 4px 0 var(--navy)}
.result.ok{background:#9be8b8}.result.bad{background:#ffadad}
.hint{text-align:center;opacity:.85;margin:6px 0 12px;font-size:19px}
/* ===== Auction ===== */
.auction{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.live{display:inline-block;background:var(--red);color:#fff;border-radius:999px;padding:3px 14px;font-size:15px;animation:pulse 1.8s infinite}
.bidnow{font-size:clamp(54px,9vw,92px);line-height:1;color:var(--em2);position:relative;display:inline-block}
.bidflash{position:absolute;right:-8px;top:-18px;background:var(--red);color:#fff;font-size:22px;padding:2px 12px;border-radius:12px;transform:rotate(8deg);opacity:0;pointer-events:none}
.bidflash.on{animation:bflash .9s}
@keyframes bflash{0%{opacity:0;transform:scale(.3) rotate(8deg)}25%{opacity:1;transform:scale(1.2) rotate(8deg)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px) rotate(8deg)}}
.hammer{width:110px}
.leader{display:inline-flex;align-items:center;gap:8px;background:var(--gold);border:3px solid var(--navy);border-radius:16px;padding:6px 16px;margin-top:6px;box-shadow:0 3px 0 var(--navy)}
.leader.hot{animation:pulse .5s}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.chip{background:var(--gold2);border:3px solid var(--navy);border-radius:16px;padding:10px 4px;font-size:18px;box-shadow:0 3px 0 var(--navy)}
.chip:hover:not(:disabled){transform:translateY(-3px);background:#fff}.chip:active:not(:disabled){transform:scale(.93)}
/* ===== Sidebar ===== */
.bal{font-size:clamp(40px,6vw,54px);line-height:1.1;display:inline-block;transition:text-shadow .3s}
.bal.up{color:#baffd9;text-shadow:0 0 18px #2fc27a}.bal.down{color:#ffd0d0;text-shadow:0 0 18px #ef4b4b;animation:shake .4s}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;border-radius:16px;margin-bottom:4px;transition:background .3s}
.row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.me{background:var(--gold);border:2px solid var(--navy)}
.row.flash{animation:pulse .6s}
#players{max-height:55vh;overflow:auto}
/* ===== Overlays / FX ===== */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.p{position:absolute;will-change:transform,opacity}
.float-money{position:absolute;font-size:34px;font-weight:700;animation:rise 1.4s forwards}
@keyframes rise{to{transform:translateY(-130px);opacity:0}}
#ov{position:fixed;inset:0;z-index:60;display:grid;place-items:center;pointer-events:none;text-align:center}
#ov .big{font-size:clamp(70px,22vw,220px);color:var(--gold);-webkit-text-stroke:4px var(--navy);text-shadow:0 8px 0 var(--navy);animation:scale .4s both;line-height:1}
#ov.sold{background:#12233fb8;animation:fade .2s}
#ov .sub{color:#fff;font-size:clamp(24px,5vw,44px)}
/* ===== Podium ===== */
.podium{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:16px 0}
.pod{flex:1;max-width:190px;text-align:center}
.pod div{border:3px solid var(--navy);border-radius:18px 18px 0 0;padding:10px 6px;font-size:18px;animation:slide .6s both}
.pod .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod.p1 div{height:170px;background:var(--gold)}.pod.p2 div{height:125px;background:#dfe6ee}.pod.p3 div{height:95px;background:#e6b184}
.pod em{font-style:normal;font-size:40px;display:block}
.stats3{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:10px}
.stats3 div{background:#fff;border:3px solid var(--navy);border-radius:18px;padding:10px;text-align:center}
.stats3 b{display:block;font-size:26px;color:var(--em2)}
/* ===== Responsive ===== */
@media(max-width:980px){.grid{grid-template-columns:1fr}}
@media(max-width:620px){.opts{grid-template-columns:1fr}.q{padding:18px 18px 18px 18px}.q svg{display:none}.chips{grid-template-columns:repeat(2,1fr)}.hammer{width:70px}.btn.go{font-size:22px;padding:14px 30px}}

/* ===== Mini-game stages ===== */
.stage{margin-bottom:10px}.deco{background:#fff;border:3px solid var(--navy);border-radius:22px;padding:14px 20px;margin-bottom:14px;font-size:clamp(18px,2.4vw,26px);text-align:center;animation:scale .4s both;box-shadow:0 4px 0 var(--navy)}
.opts.one{grid-template-columns:1fr}
.blank{display:inline-block;min-width:140px;border-bottom:5px dashed var(--em);color:var(--em2);padding:0 8px}.blank.filled{border-bottom-style:solid;animation:pop .4s}
.hg{display:inline-block;animation:flip 2.4s ease-in-out infinite}@keyframes flip{50%{transform:rotate(180deg)}}
.token{display:inline-grid;place-items:center;width:60px;height:60px;margin:0 8px;border-radius:16px;background:var(--gold);border:3px solid var(--navy);box-shadow:0 4px 0 var(--navy);cursor:grab;font-size:34px;animation:float 3s ease-in-out infinite}
.mx{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;text-align:center}.mx div{background:#fff;border:3px solid var(--navy);border-radius:18px;padding:10px;font-size:clamp(15px,2vw,22px);opacity:.55}.mx .hot{opacity:1;background:var(--gold);animation:pulse 1.8s infinite}.mx small{opacity:.7}
.steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:17px}.steps b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;margin-right:6px;font-size:14px}.steps em{font-style:normal;opacity:.5}
.vs{display:flex;justify-content:space-around;align-items:center}.vs b{background:var(--red);color:#fff;border-radius:50%;width:56px;height:56px;display:grid;place-items:center;animation:pulse 1.6s infinite}
.loop em{font-style:normal;opacity:.5}.gap{display:inline-block;background:var(--gold);border:3px dashed var(--navy);border-radius:12px;padding:0 10px;animation:pulse 1.6s infinite}
.flood{position:relative;height:96px;overflow:hidden}.flood span{position:absolute;top:-30px;font-size:30px;animation:fall2 2.4s linear infinite}@keyframes fall2{to{transform:translateY(130px)}}
.meter{position:absolute;left:10%;right:10%;bottom:8px;height:14px;border:3px solid var(--navy);border-radius:9px;background:#fff;overflow:hidden}.meter div{height:100%;width:100%;background:var(--red);animation:rise2 3s ease-in-out infinite alternate}@keyframes rise2{from{width:30%}}
.hp{margin-top:8px;height:22px;border:3px solid var(--navy);border-radius:12px;background:#fff;overflow:hidden}.hp div{height:100%;background:var(--red);transition:width 1s}
.why{margin-top:12px;background:#fff;border:3px solid var(--navy);border-radius:20px;padding:14px 18px;font-size:clamp(17px,2vw,24px);text-align:left;animation:slide .5s both}
.timer{position:fixed;top:64px;right:16px;z-index:45;display:grid;place-items:center;min-width:96px;height:72px;padding:0 20px;border-radius:36px;background:var(--navy);color:var(--gold);border:4px solid var(--gold);box-shadow:0 8px 24px #12233f66;font-size:38px;pointer-events:none}
.timer.warn{background:var(--red);color:#fff;animation:pulse .5s infinite}
body.host .timer{font-size:72px;min-width:170px;height:120px;border-radius:60px;top:70px;right:24px}
/* ===== Host / Zoom projection mode ===== */
.hbar{display:flex;gap:12px;flex-wrap:wrap}
body.host .hbar .btn{flex:1;font-size:26px;padding:18px 20px}body.host .hbar .btn.sm{flex:0 0 auto;font-size:16px;padding:8px 14px}
.btn.next{background:var(--em);color:#fff;animation:glow 1.6s ease-in-out infinite;transform:scale(1.04)}
body.host .wrap{max-width:1500px}
body.host .q{font-size:clamp(26px,3.4vw,46px)}
body.host .opt{font-size:clamp(22px,2.5vw,34px);min-height:104px}body.host .opt i{width:64px;height:64px;font-size:32px}
body.host .deco,body.host .why{font-size:clamp(22px,2.6vw,34px)}
body.host .bidnow{font-size:clamp(90px,13vw,170px)}
body.host .leader{font-size:clamp(26px,3vw,44px)}
body.host .row{font-size:clamp(20px,2vw,30px);padding:10px 14px}
body.host .pill{font-size:clamp(18px,1.8vw,26px)}
body.host .grid{grid-template-columns:minmax(0,1fr) 420px}
body.host #hostCard{position:sticky;bottom:8px;z-index:20}
@media(max-width:980px){body.host .grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}#bg i{display:none}}
</style></head><body>
<div id="bg"><svg viewBox="0 0 800 200" preserveAspectRatio="none"><polyline points="0,170 90,140 170,155 260,100 350,120 450,60 550,85 650,30 800,50" fill="none" stroke="#0f9d6e" stroke-width="6" stroke-linecap="round"/><polyline points="0,190 120,170 240,180 380,140 520,150 700,110 800,120" fill="none" stroke="#ffc633" stroke-width="5" stroke-linecap="round"/></svg></div>
<div class="timer hidden" id="timer" role="timer" aria-live="off">15</div><div id="fx"></div><div id="ov" class="hidden"></div>

<!-- Reusable SVG illustrations -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="gavel" viewBox="0 0 200 200"><g stroke="#12233f" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"><rect x="20" y="168" width="130" height="18" rx="9" fill="#0f9d6e"/><rect x="82" y="78" width="22" height="96" rx="10" fill="#c98b4b" transform="rotate(38 93 126)"/><rect x="48" y="26" width="84" height="46" rx="14" fill="#ffc633" transform="rotate(38 90 49)"/><rect x="62" y="22" width="14" height="54" rx="6" fill="#e6a800" transform="rotate(38 69 49)"/></g></symbol>
<symbol id="coin" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="#ffc633" stroke="#12233f" stroke-width="3"/><text x="20" y="27" text-anchor="middle" font-size="20" font-weight="700" fill="#12233f" font-family="Fredoka,sans-serif">$</text></symbol>
<symbol id="chart" viewBox="0 0 100 100"><rect x="6" y="6" width="88" height="88" rx="18" fill="#cdf3e3" stroke="#12233f" stroke-width="4"/><rect x="20" y="58" width="12" height="22" fill="#0f9d6e"/><rect x="40" y="44" width="12" height="36" fill="#0f9d6e"/><rect x="60" y="30" width="12" height="50" fill="#ffc633" stroke="#12233f" stroke-width="2"/><polyline points="18,50 40,36 56,40 80,16" fill="none" stroke="#ef4b4b" stroke-width="5" stroke-linecap="round"/></symbol>
<symbol id="trophy" viewBox="0 0 100 100"><g stroke="#12233f" stroke-width="4" stroke-linejoin="round"><path d="M28 12h44v28a22 22 0 0 1-44 0z" fill="#ffc633"/><path d="M28 18H12c0 18 8 26 18 26M72 18h16c0 18-8 26-18 26" fill="none"/><rect x="44" y="60" width="12" height="16" fill="#e6a800"/><rect x="30" y="76" width="40" height="14" rx="5" fill="#0f9d6e"/></g></symbol>
</defs></svg>

<header><b><svg width="26" height="26"><use href="#coin"/></svg> Finance Auction</b>
<div class="top"><span id="status" class="pill">Offline</span><button class="btn sm alt" id="mus" onclick="toggleMusic()" aria-label="Toggle music">🎵</button><button class="btn sm alt" id="snd" onclick="toggleSound()" aria-label="Toggle sound">🔊</button></div></header>
<div class="wrap">

<section id="start">
<h1 class="title">Finance<br>Auction</h1>
<div class="topic">TOPIC 15</div>
<svg class="hero float" viewBox="0 0 200 200"><use href="#gavel"/></svg>
<div class="menu"><button class="btn go" onclick="showJoin()">Start game</button><button class="btn" onclick="showRules()">Rules</button><button class="btn alt" onclick="hostMode()">Host mode</button></div>
</section>

<section id="join" class="card narrow hidden">
<h2>Join the game</h2>
<label for="room">Room code</label><input id="room" value="FA2026" autocomplete="off">
<label for="name">Nickname</label><input id="name" placeholder="Your name" autocomplete="off">
<button class="btn" onclick="join()">Join as student</button>
<button class="btn alt" onclick="host()">Host</button>
</section>

<section id="rules" class="card narrow hidden" style="max-width:820px">
<h2 class="center">Game rules</h2>
<div class="rgrid" id="rgrid"></div>
<p class="center"><button class="btn" id="rulesBtn" onclick="ready()">I'm ready!</button></p>
</section>

<section id="game" class="hidden"><div class="grid"><main>
<div><span class="pill" id="round"></span><span class="pill" id="phase"></span></div>
<div class="q" id="question">Waiting for host…</div>
<div id="answers"></div><div id="result"></div>
<div class="card white" id="auctionCard"><div class="auction"><div>
<span class="live">🔨 LIVE AUCTION</span>
<div style="margin-top:8px">Current bid</div>
<div class="bidnow" id="bid">$0</div><span class="bidflash" id="bidflash">BID!</span>
<div>Highest bidder<br><span class="leader" id="leader"><svg width="24" height="24"><use href="#coin"/></svg><b id="bidder">—</b></span></div></div>
<svg class="hammer" id="hammer" viewBox="0 0 200 200"><use href="#gavel"/></svg></div>
<div class="chips" id="bidButtons"></div></div>
<div class="card hidden" id="hostCard"><div class="hbar">
<button class="btn" data-act="open_auction" onclick="send('open_auction')">▶ Open auction</button>
<button class="btn" data-act="sold" onclick="send('sold')">🔨 SOLD</button>
<button class="btn" data-act="next_round" onclick="send('next_round')">⏭ Next round</button>
<button class="btn alt sm" data-act="reset" onclick="if(confirm('Reset the whole game?'))send('reset')">Reset</button></div>
<p class="hint">Space = highlighted button · answers are graded automatically</p></div>
</main><aside>
<div class="card green"><div>Your balance</div><div class="bal" id="balance">$1,000</div><div id="stats"></div></div>
